# ============================================================================
# Project-wide Gradle settings.
# ============================================================================
# 说明：本文件里带 ★ 的几项，是为了在**受限环境**（沙箱 / 安全软件 / 组策略
# 拦截进程写工作区外目录）下也能正常构建。如果你的机器没有这类限制，
# 可以按各项注释里写的办法还原为默认值。
# ============================================================================

# ----------------------------------------------------------------------------
# JVM 参数
# ----------------------------------------------------------------------------
# ★ -Djava.io.tmpdir 指向工程内的 .gradle-tmp（见文件末尾「临时目录」一节）。
#
# ⚠️ 这里只能写**绝对路径**，且不能用 Gradle 变量插值：
#   · ${projectDir} 在 org.gradle.jvmargs 里不会被替换，会原样交给 JVM，
#     报错：java.io.tmpdir is set to a directory that doesn't exist:
#           ${projectDir}\.gradle-tmp
#   · 相对路径相对「daemon 进程的工作目录」解析，会报
#     NoSuchFileException: .gradle-tmp\kotlin-compiler-in-*.alive
# 本工程路径固定，所以直接写绝对路径。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.io.tmpdir=C:/Users/zheng/AndroidStudioProjects/ZakoCountdown/.gradle-tmp

# ★ Kotlin 编译在 Gradle daemon 进程内完成，不另起进程（见文件末尾说明）。
kotlin.compiler.execution.strategy=in-process

# ★ 关掉原生文件系统监视。受限环境下它会抛
#     NativeException: Couldn't open current thread, error = 5
#   属于噪声（Gradle 会自动回退轮询），关掉后构建结果一致、日志干净。
org.gradle.vfs.watch=false

# ----------------------------------------------------------------------------
# 常规配置
# ----------------------------------------------------------------------------
# 并行构建（可选）。仅适用于解耦的多模块工程。
# org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
# 每个库的 R 类只包含自身资源，减小 R 类体积
android.nonTransitiveRClass=true

# ============================================================================
# ★【daemon 崩溃修复】一个很容易踩空的坑
# ----------------------------------------------------------------------------
# 症状（Android Studio Sync / 构建报错）：
#   Unable to start the daemon process / incorrect configuration of the daemon
#   Could not initialize native services
#   java.io.FileNotFoundException: ...\native-platform.dll.lock (拒绝访问)
#
# 真正原因不是 JVM 参数。Gradle daemon 启动时要初始化「原生服务」，会在
#   <GRADLE_USER_HOME>\native\<hash>\windows-amd64\
# 下创建 native-platform.dll.lock。当 GRADLE_USER_HOME（默认
# C:\Users\<你>\.gradle）不可写时，这一步失败，daemon 直接退出。
#   ⇒ 所以改 org.gradle.jvmargs 是无效的，报错里那句
#     "Check the JVM arguments" 会把人带偏。
#
# 实测排除过一个错误答案：Gradle **忽略**本文件里的
#   org.gradle.user.home
# 属性（写了它 daemon 仍然崩）。GRADLE_USER_HOME 只认环境变量或命令行参数。
#
# 正确的修复方式只有一个：把 GRADLE_USER_HOME 指到一个可写目录。
#
#   【方式 A】命令行
#       set GRADLE_USER_HOME=%CD%\.gradle-home
#       gradlew.bat assembleDebug
#
#   【方式 B】Android Studio（推荐，一次配置永久生效）
#       Settings → Build, Execution, Deployment → Build Tools → Gradle
#         · Gradle user home : <工程目录>\.gradle-home
#         · Gradle JDK       : <工程目录>\jdk-17.0.12
#
# 代价：依赖会重新下载到工程内，首次同步慢一些（约 1 GB）。
# 若哪天 C:\Users\<你>\.gradle 恢复可写，把 Gradle user home 清空即可回到默认。
# ============================================================================

# ============================================================================
# ★【临时目录】KSP / Kotlin 编译失败修复
# ----------------------------------------------------------------------------
# 症状：
#   Task :app:kspDebugKotlin FAILED
#   java.nio.file.AccessDeniedException:
#     C:\Users\<你>\AppData\Local\Temp\kotlin-compiler-in-<project>-<随机>.alive
#   以及（Kotlin 编译 daemon 起不来时）
#     Could not connect to Kotlin compile daemon
#
# 原因：Kotlin / KSP 会在 java.io.tmpdir 下创建「存活标记」文件来检测编译器
# 进程是否还活着（kotlin-gradle-plugin 的 FileUtilsKt.newTmpFile）。系统临时
# 目录不可写时这一步直接失败，整个 KSP 任务挂掉，Kotlin 编译也就不会执行。
# 另外 KSP 内嵌的 SQLite 也会在这里建 sqlite-*.tmp。
#
# 解决：把 daemon 的 java.io.tmpdir 指到工程内（见文件开头的 org.gradle.jvmargs）。
#   · 必须是绝对路径（原因见上）
#   · 工程内已提供 .gradle-tmp 目录，不要删除（它已在 .gitignore 里）
#
# 说明：为什么不用 kotlin.daemon.jvmargs 也设一遍？
#   因为上面已经把 kotlin.compiler.execution.strategy 设为 in-process，
#   不再有独立的 Kotlin daemon 进程，那一项就多余了。
#
# 说明：为什么不再需要重定向 user.home / TEMP / TMP？
#   Kotlin 编译 daemon 的标记文件固定写在 <user.home>\.kotlin\daemon\ 下，
#   这是 -D 参数改不掉的（本地库不认），只有环境变量能影响。
#   改用 in-process 后这个进程根本不存在，问题自然消失；
#   sqlite 的临时文件则跟着 java.io.tmpdir 走，也已指向工程内。
# ============================================================================
